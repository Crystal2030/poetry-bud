<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <!-- 纸影 -->
    <polygon points="6.4,3.6 20.4,12.6 6.4,21.6" fill="#B5A68A"/>
    <!-- 主体三角 -->
    <polygon points="6,3 20,12 6,21" fill="#F4EBDA"/>
