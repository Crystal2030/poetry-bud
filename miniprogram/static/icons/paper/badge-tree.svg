<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="canopy1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#66BB6A"/>
    </linearGradient>
    <linearGradient id="canopy2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5D6A7"/>
      <stop offset="1" stop-color="#81C784"/>
    </linearGradient>
    <linearGradient id="canopy3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C5E1A5"/>
      <stop offset="1" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8D6E63"/>
      <stop offset="1" stop-color="#5D4037"/>
    </linearGradient>
  </defs>
  <!-- 背景：年轮同心圆 -->
  <g opacity="0.18" fill="none" stroke="#66BB6A" stroke-width="0.4">
    <circle cx="32" cy="28" r="10"/>
    <circle cx="32" cy="28" r="14"/>
    <circle cx="32" cy="28" r="18"/>
  </g>
  <!-- 泥土基线 -->
  <path d="M 4 56 Q 32 53 60 56" stroke="#6D4C41" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- 中景：树干 + 根须 -->
  <g filter="url(#ds)">
    <path d="M 30 56 L 28 32 L 36 32 L 34 56 Z" fill="url(#trunk)" stroke="#3E2723" stroke-width="0.5"/>
    <line x1="32" y1="36" x2="32" y2="52" stroke="#3E2723" stroke-width="0.4" opacity="0.6"/>
    <!-- 根须 -->
    <path d="M 28 56 Q 24 58 22 60" stroke="#5D4037" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 36 56 Q 40 58 42 60" stroke="#5D4037" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 前景：3 层树冠（从大到小叠） -->
  <g filter="url(#ds)">
    <!-- 底层树冠（最大，深绿） -->
    <ellipse cx="32" cy="28" rx="20" ry="14" fill="url(#canopy1)" stroke="#2E7D32" stroke-width="0.6"/>
    <!-- 折角 -->
    <path d="M 14 30 Q 16 32 20 30" stroke="#2E7D32" stroke-width="0.4" fill="none" opacity="0.6"/>
    <path d="M 44 26 Q 46 28 50 26" stroke="#2E7D32" stroke-width="0.4" fill="none" opacity="0.6"/>
  </g>
  <g filter="url(#ds)">
    <!-- 中层树冠 -->
    <ellipse cx="32" cy="24" rx="14" ry="10" fill="url(#canopy2)" stroke="#388E3C" stroke-width="0.5"/>
  </g>
  <g filter="url(#ds)">
    <!-- 顶层树冠（最小最亮） -->
    <ellipse cx="32" cy="20" rx="8" ry="6" fill="url(#canopy3)" stroke="#4CAF50" stroke-width="0.5"/>
  </g>
</svg>
