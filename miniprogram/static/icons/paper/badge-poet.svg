<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E5F5"/>
      <stop offset="1" stop-color="#E8D5F5"/>
    </linearGradient>
    <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D5F5"/>
      <stop offset="1" stop-color="#CE93D8"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="1" stop-color="#FFECB3"/>
    </linearGradient>
  </defs>
  <!-- 背景：流线云气 -->
  <g opacity="0.22" stroke="#CE93D8" stroke-width="0.5" fill="none" stroke-linecap="round">
    <path d="M 6 20 Q 16 18 26 22 Q 36 26 46 22 Q 54 20 58 24"/>
    <path d="M 6 50 Q 16 48 26 52 Q 36 56 46 52 Q 54 50 58 54"/>
  </g>
  <!-- 中景：祥云（多层云纹） -->
  <g filter="url(#ds)">
    <path d="M 10 38 Q 6 36 8 30 Q 10 26 16 28 Q 18 22 26 24 Q 32 20 38 24 Q 46 22 48 28 Q 56 28 56 34 Q 58 40 52 42 L 14 42 Q 8 42 10 38 Z" fill="url(#cloud)" stroke="#9C27B0" stroke-width="0.6"/>
    <!-- 内部云纹折线 -->
    <path d="M 16 34 Q 22 32 28 34 Q 34 36 40 34" stroke="#9C27B0" stroke-width="0.4" fill="none" opacity="0.5"/>
    <path d="M 42 38 Q 46 36 50 38" stroke="#9C27B0" stroke-width="0.4" fill="none" opacity="0.5"/>
  </g>
  <!-- 中景：竹简（暖米色，微微展开） -->
  <g filter="url(#ds)">
    <!-- 竹简左轴 -->
    <ellipse cx="16" cy="44" rx="2" ry="3" fill="#A1887F" stroke="#5D4037" stroke-width="0.4"/>
    <!-- 竹简右轴 -->
    <ellipse cx="48" cy="44" rx="2" ry="3" fill="#A1887F" stroke="#5D4037" stroke-width="0.4"/>
    <!-- 竹简主体（微微展开的纸卷） -->
    <path d="M 16 41 Q 22 38 32 40 Q 42 38 48 41 L 48 47 Q 42 50 32 48 Q 22 50 16 47 Z" fill="url(#bamboo)" stroke="#A8761E" stroke-width="0.5"/>
    <!-- 诗行 3 条横线 -->
    <line x1="22" y1="42" x2="42" y2="42" stroke="#5D4037" stroke-width="0.4"/>
    <line x1="22" y1="44" x2="42" y2="44" stroke="#5D4037" stroke-width="0.4"/>
    <line x1="22" y1="46" x2="38" y2="46" stroke="#5D4037" stroke-width="0.4"/>
  </g>
  <!-- 前景：系绳穗子（左侧垂下） -->
  <g>
    <line x1="16" y1="47" x2="16" y2="54" stroke="#A8761E" stroke-width="0.5"/>
    <circle cx="16" cy="55" r="1" fill="#E0A92E" stroke="#A8761E" stroke-width="0.3"/>
    <circle cx="14" cy="56" r="0.6" fill="#FFD54F"/>
    <circle cx="18" cy="56" r="0.6" fill="#FFD54F"/>
  </g>
  <!-- 飘落的桃花瓣（前景，回扣花开阶段） -->
  <g>
    <path d="M 50 18 Q 48 14 50 12 Q 52 14 54 12 Q 56 14 54 18 Q 52 20 50 18 Z" fill="#F48FB1" stroke="#AD1457" stroke-width="0.4"/>
    <line x1="52" y1="14" x2="52" y2="18" stroke="#AD1457" stroke-width="0.3"/>
  </g>
</svg>
