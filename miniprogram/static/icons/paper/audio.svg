<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <!-- 三条滑轨（纸影+主体） -->
    <!-- 左轨 -->
    <rect x="6.4" y="8" width="3.5" height="12" rx="1.7" fill="#B5A68A"/>
    <rect x="6" y="7.5" width="3.5" height="12" rx="1.7" fill="#3E5C6B" opacity=".35"/>
    <!-- 中轨 -->
    <rect x="10.4" y="5" width="3.5" height="15" rx="1.7" fill="#B5A68A"/>
    <rect x="10" y="4.5" width="3.5" height="15" rx="1.7" fill="#3E5C6B" opacity=".35"/>
    <!-- 右轨 -->
    <rect x="14.4" y="4" width="3.5" height="16" rx="1.7" fill="#B5A68A"/>
    <rect x="14" y="3.5" width="3.5" height="16" rx="1.7" fill="#3E5C6B" opacity=".35"/>
    <!-- 纸艺滑块旋钮（圆形纸片） -->
    <!-- 左钮（低位） -->
    <circle cx="8" cy="17.5" r="2.5" fill="#B5A68A"/>
    <circle cx="7.8" cy="17.2" r="2.5" fill="#C9A24B"/>
    <circle cx="7.8" cy="17.2" r="1" fill="#F4EBDA" opacity=".4"/>
    <!-- 中钮（中位） -->
    <circle cx="12" cy="12" r="2.5" fill="#B5A68A"/>
    <circle cx="11.8" cy="11.7" r="2.5" fill="#C9A24B"/>
    <circle cx="11.8" cy="11.7" r="1" fill="#F4EBDA" opacity=".4"/>
    <!-- 右钮（高位） -->
    <circle cx="16" cy="5.5" r="2.5" fill="#B5A68A"/>
    <circle cx="15.8" cy="5.2" r="2.5" fill="#C9A24B"/>
    <circle cx="15.8" cy="5.2" r="1" fill="#F4EBDA" opacity=".4"/>
  </svg>