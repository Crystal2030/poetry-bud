<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="peach" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFD180"/>
      <stop offset="0.55" stop-color="#FFB74D"/>
      <stop offset="1" stop-color="#E8913A"/>
    </radialGradient>
    <linearGradient id="peachLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#388E3C"/>
    </linearGradient>
  </defs>
  <!-- 背景：编织纹理（细斜线交叉） -->
  <g opacity="0.16" stroke="#A8761E" stroke-width="0.4">
    <line x1="6" y1="6" x2="14" y2="14"/><line x1="14" y1="6" x2="6" y2="14"/>
    <line x1="50" y1="50" x2="58" y2="58"/><line x1="58" y1="50" x2="50" y2="58"/>
    <line x1="6" y1="50" x2="14" y2="58"/><line x1="14" y1="50" x2="6" y2="58"/>
    <line x1="50" y1="6" x2="58" y2="14"/><line x1="58" y1="6" x2="50" y2="14"/>
  </g>
  <!-- 中景：蜜桃主体（圆润，左尖右圆） -->
  <g filter="url(#ds)">
    <path d="M 20 22 Q 16 32 20 44 Q 26 56 38 54 Q 50 52 50 38 Q 50 24 38 20 Q 28 18 20 22 Z" fill="url(#peach)" stroke="#A8590A" stroke-width="0.7"/>
    <!-- 桃身折痕（中心浅弧） -->
    <path d="M 24 28 Q 32 32 40 28" stroke="#A8590A" stroke-width="0.4" fill="none" opacity="0.5"/>
    <!-- 桃尖胭脂红晕染 -->
    <ellipse cx="44" cy="32" rx="4" ry="6" fill="#F48FB1" opacity="0.35"/>
  </g>
  <!-- 前景：桃叶（深绿锯齿边，挂在桃尖左侧） -->
  <g filter="url(#ds)">
    <path d="M 20 22 Q 10 18 6 12 Q 8 20 14 22 Q 10 26 8 30 Q 16 28 20 22 Z" fill="url(#peachLeaf)" stroke="#1B5E20" stroke-width="0.5"/>
    <!-- 叶脉折线 -->
    <line x1="14" y1="22" x2="20" y2="22" stroke="#1B5E20" stroke-width="0.4"/>
    <line x1="14" y1="22" x2="10" y2="18" stroke="#1B5E20" stroke-width="0.3" opacity="0.6"/>
    <line x1="14" y1="22" x2="10" y2="26" stroke="#1B5E20" stroke-width="0.3" opacity="0.6"/>
  </g>
  <!-- 短梗 -->
  <line x1="20" y1="22" x2="18" y2="16" stroke="#6D4C41" stroke-width="1.2" stroke-linecap="round"/>
</svg>
