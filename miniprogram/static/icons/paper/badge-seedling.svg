<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AED581"/>
      <stop offset="1" stop-color="#7CB342"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#558B2F"/>
      <stop offset="1" stop-color="#8BC34A"/>
    </linearGradient>
  </defs>
  <!-- 背景：竖条纹雨丝 -->
  <g opacity="0.2" stroke="#8BC34A" stroke-width="0.5">
    <line x1="10" y1="8" x2="10" y2="14"/>
    <line x1="18" y1="6" x2="18" y2="12"/>
    <line x1="46" y1="6" x2="46" y2="12"/>
    <line x1="54" y1="8" x2="54" y2="14"/>
    <line x1="8" y1="50" x2="8" y2="56"/>
    <line x1="56" y1="50" x2="56" y2="56"/>
  </g>
  <!-- 泥土基线 -->
  <path d="M 6 56 Q 32 53 58 56" stroke="#8B6B3E" stroke-width="1.2" fill="none" opacity="0.6"/>
  <!-- 中景：茎秆 -->
  <g filter="url(#ds)">
    <path d="M 32 56 L 32 22" stroke="url(#stem)" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="40" x2="32" y2="50" stroke="#33691E" stroke-width="0.4" opacity="0.5"/>
  </g>
  <!-- 前景：两片肥厚子叶（左右张开） -->
  <g filter="url(#ds)">
    <!-- 左子叶 -->
    <ellipse cx="22" cy="40" rx="9" ry="5" fill="url(#leaf)" stroke="#558B2F" stroke-width="0.6" transform="rotate(-25 22 40)"/>
    <line x1="22" y1="40" x2="14" y2="44" stroke="#33691E" stroke-width="0.4" opacity="0.5" transform="rotate(-25 22 40)"/>
    <!-- 右子叶 -->
    <ellipse cx="42" cy="40" rx="9" ry="5" fill="url(#leaf)" stroke="#558B2F" stroke-width="0.6" transform="rotate(25 42 40)"/>
    <line x1="42" y1="40" x2="50" y2="44" stroke="#33691E" stroke-width="0.4" opacity="0.5" transform="rotate(25 42 40)"/>
  </g>
  <!-- 顶端一对真叶芽 -->
  <g>
    <path d="M 32 22 Q 28 16 26 12 Q 30 14 32 18 Q 34 14 38 12 Q 36 16 32 22 Z" fill="#9CCC65" stroke="#558B2F" stroke-width="0.5"/>
    <line x1="32" y1="14" x2="32" y2="20" stroke="#33691E" stroke-width="0.4" opacity="0.6"/>
  </g>
</svg>
