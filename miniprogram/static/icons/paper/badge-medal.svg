<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="goldR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#E0A92E"/>
    </linearGradient>
    <linearGradient id="leafR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5D6A7"/>
      <stop offset="1" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>
  <!-- 背景：放射麦芒 -->
  <g opacity="0.22" stroke="#E0A92E" stroke-width="0.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="8"/>
    <line x1="32" y1="32" x2="56" y2="32"/>
    <line x1="32" y1="32" x2="32" y2="56"/>
    <line x1="32" y1="32" x2="8" y2="32"/>
    <line x1="32" y1="32" x2="48" y2="16"/>
    <line x1="32" y1="32" x2="48" y2="48"/>
    <line x1="32" y1="32" x2="16" y2="48"/>
    <line x1="32" y1="32" x2="16" y2="16"/>
  </g>
  <!-- 中景：双层圆环 + 环抱月牙叶 -->
  <g filter="url(#ds)">
    <path d="M 14 32 Q 6 24 8 16 Q 16 20 19 30 Z" fill="url(#leafR)" stroke="#2E7D32" stroke-width="0.5"/>
    <path d="M 14 30 Q 11 25 12 21" stroke="#1B5E20" stroke-width="0.4" fill="none" opacity="0.5"/>
    <path d="M 50 32 Q 58 24 56 16 Q 48 20 45 30 Z" fill="url(#leafR)" stroke="#2E7D32" stroke-width="0.5"/>
    <path d="M 50 30 Q 53 25 52 21" stroke="#1B5E20" stroke-width="0.4" fill="none" opacity="0.5"/>
    <circle cx="32" cy="32" r="19" fill="url(#goldR)" stroke="#A8761E" stroke-width="0.7"/>
    <circle cx="32" cy="32" r="14" fill="#FFFDE7" stroke="#E0A92E" stroke-width="0.5"/>
  </g>
  <!-- 前景：种子裂口 + 嫩芽 -->
  <g>
    <ellipse cx="32" cy="38" rx="5.5" ry="4.2" fill="#B8956A" stroke="#7a5a2a" stroke-width="0.5"/>
    <path d="M 32 34 L 32 42" stroke="#5a3a1a" stroke-width="0.5" fill="none"/>
    <path d="M 30 35 Q 29 30 27 27 Q 30 28 32 32 Q 34 28 37 27 Q 35 30 34 35" fill="#C5E17A" stroke="#5a8a2a" stroke-width="0.5"/>
    <line x1="32" y1="28" x2="32" y2="34" stroke="#5a8a2a" stroke-width="0.4"/>
  </g>
</svg>
