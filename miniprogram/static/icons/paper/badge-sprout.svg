<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="seed" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#D4B488"/>
      <stop offset="1" stop-color="#8B6B3E"/>
    </radialGradient>
    <linearGradient id="sprout" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7CB342"/>
      <stop offset="1" stop-color="#C5E17A"/>
    </linearGradient>
  </defs>
  <!-- 背景：纸纹肌理（小圆点） -->
  <g opacity="0.18" fill="#A89070">
    <circle cx="14" cy="14" r="0.6"/><circle cx="50" cy="18" r="0.6"/>
    <circle cx="22" cy="50" r="0.6"/><circle cx="48" cy="46" r="0.6"/>
    <circle cx="56" cy="36" r="0.6"/><circle cx="10" cy="36" r="0.6"/>
    <circle cx="18" cy="26" r="0.6"/><circle cx="46" cy="10" r="0.6"/>
  </g>
  <!-- 中景：3 道泥土弧线 -->
  <g stroke="#8B6B3E" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 6 50 Q 32 46 58 50" stroke-width="1.4"/>
    <path d="M 8 54 Q 32 50 56 54" stroke-width="1"/>
    <path d="M 10 58 Q 32 54 54 58" stroke-width="0.7"/>
  </g>
  <!-- 前景：裂开种子 + 嫩芽尖 -->
  <g filter="url(#ds)">
    <!-- 种子主体（椭圆形） -->
    <ellipse cx="32" cy="44" rx="9" ry="7" fill="url(#seed)" stroke="#5a3a1a" stroke-width="0.6"/>
    <!-- 裂口（中间缝隙） -->
    <path d="M 30 38 L 32 44 L 34 38" stroke="#3a2a1a" stroke-width="0.6" fill="none"/>
    <!-- 种子壳面折痕 -->
    <path d="M 26 44 Q 28 42 30 44" stroke="#5a3a1a" stroke-width="0.4" fill="none" opacity="0.6"/>
    <path d="M 38 44 Q 36 42 34 44" stroke="#5a3a1a" stroke-width="0.4" fill="none" opacity="0.6"/>
  </g>
  <!-- 嫩芽尖（最前景，从裂口冒出） -->
  <g>
    <path d="M 32 38 Q 28 30 26 24 Q 30 28 32 32 Q 34 28 38 24 Q 36 30 32 38 Z" fill="url(#sprout)" stroke="#558B2F" stroke-width="0.5"/>
    <line x1="32" y1="26" x2="32" y2="36" stroke="#33691E" stroke-width="0.4" opacity="0.6"/>
  </g>
</svg>
