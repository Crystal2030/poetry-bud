<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.6" flood-color="#5a3a1a" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="petal" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#FCE4EC"/>
      <stop offset="1" stop-color="#F48FB1"/>
    </radialGradient>
    <linearGradient id="sepal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81C784"/>
      <stop offset="1" stop-color="#4CAF50"/>
    </linearGradient>
  </defs>
  <!-- 背景：散落花粉圆点 -->
  <g opacity="0.35" fill="#FFD54F">
    <circle cx="10" cy="12" r="0.9"/><circle cx="54" cy="14" r="0.9"/>
    <circle cx="14" cy="54" r="0.9"/><circle cx="50" cy="50" r="0.9"/>
    <circle cx="8" cy="32" r="0.7"/><circle cx="56" cy="32" r="0.7"/>
    <circle cx="20" cy="8" r="0.7"/><circle cx="44" cy="58" r="0.7"/>
  </g>
  <!-- 中景：五瓣桃花（中心 32,32） -->
  <g filter="url(#ds)">
    <!-- 5 片花瓣（每片从中心向外，逆时针 5 片） -->
    <ellipse cx="32" cy="20" rx="6" ry="8" fill="url(#petal)" stroke="#AD1457" stroke-width="0.5"/>
    <ellipse cx="46" cy="28" rx="6" ry="8" fill="url(#petal)" stroke="#AD1457" stroke-width="0.5" transform="rotate(72 46 28)"/>
    <ellipse cx="42" cy="44" rx="6" ry="8" fill="url(#petal)" stroke="#AD1457" stroke-width="0.5" transform="rotate(144 42 44)"/>
    <ellipse cx="22" cy="44" rx="6" ry="8" fill="url(#petal)" stroke="#AD1457" stroke-width="0.5" transform="rotate(216 22 44)"/>
    <ellipse cx="18" cy="28" rx="6" ry="8" fill="url(#petal)" stroke="#AD1457" stroke-width="0.5" transform="rotate(288 18 28)"/>
  </g>
  <!-- 萼片（5 角托底） -->
  <g>
    <path d="M 32 50 L 26 56 L 32 54 L 38 56 Z" fill="url(#sepal)" stroke="#2E7D32" stroke-width="0.5"/>
    <line x1="32" y1="50" x2="32" y2="56" stroke="#1B5E20" stroke-width="0.4" opacity="0.6"/>
  </g>
  <!-- 前景：3 根花蕊（中心金黄细条） -->
  <g>
    <circle cx="32" cy="32" r="3.5" fill="#FFD54F" stroke="#E0A92E" stroke-width="0.4"/>
    <line x1="32" y1="29" x2="32" y2="22" stroke="#E0A92E" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="32" y1="29" x2="28" y2="23" stroke="#E0A92E" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="32" y1="29" x2="36" y2="23" stroke="#E0A92E" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="32" cy="22" r="1" fill="#FFE082" stroke="#A8761E" stroke-width="0.3"/>
    <circle cx="28" cy="23" r="1" fill="#FFE082" stroke="#A8761E" stroke-width="0.3"/>
    <circle cx="36" cy="23" r="1" fill="#FFE082" stroke="#A8761E" stroke-width="0.3"/>
  </g>
</svg>
