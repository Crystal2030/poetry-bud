<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lm-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4CCBE"/>
      <stop offset="1" stop-color="#A89B85"/>
    </linearGradient>
    <linearGradient id="lm-shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9BBA7"/>
      <stop offset="1" stop-color="#8C7A6B"/>
    </linearGradient>
    <filter id="lm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#5A5347" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景纸圆（unearned 状态：浅米色圆，比 earned 暗一档） -->
  <circle cx="32" cy="32" r="30" fill="#F0EDE6" stroke="#D4CCBE" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- 锁体 -->
  <g filter="url(#lm-shadow)">
    <!-- 锁体底（圆角矩形） -->
    <path d="M19 33 H45 V51 a4 4 0 0 1 -4 4 H23 a4 4 0 0 1 -4 -4 Z"
          fill="url(#lm-body)" stroke="#5A5347" stroke-width="1.2"/>
    <!-- 锁体折痕线（手作感） -->
    <line x1="22" y1="36" x2="42" y2="36" stroke="#8C7A6B" stroke-width="0.6" opacity="0.4"/>
    <!-- 锁芯孔（钥匙孔） -->
    <circle cx="32" cy="41" r="3" fill="#5A5347"/>
    <rect x="31" y="41" width="2" height="6" fill="#5A5347"/>
  </g>

  <!-- 锁梁（U 形） -->
  <g filter="url(#lm-shadow)">
    <path d="M22 33 V24 a10 10 0 0 1 20 0 V33"
          fill="none" stroke="url(#lm-shackle)" stroke-width="4" stroke-linecap="round"/>
    <!-- 锁梁内圈（立体感） -->
    <path d="M24 32 V24 a8 8 0 0 1 16 0 V32"
          fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
