<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 156">
  <defs>
    <filter id="ps" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0.8" dy="0.8" stdDeviation="1.2" flood-color="#8A5F42" flood-opacity="0.3"/>
    </filter>
    <filter id="pm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#8A5F42" flood-opacity="0.2"/>
    </filter>
    <filter id="pb" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.5" flood-color="#8A5F42" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- 背景：竹简横纹 -->
  <g opacity="0.12">
    <line x1="140" y1="20" x2="310" y2="20" stroke="#C9A24B" stroke-width="0.6" stroke-dasharray="4,18"/>
    <line x1="150" y1="40" x2="305" y2="40" stroke="#C9A24B" stroke-width="0.5" stroke-dasharray="6,16"/>
    <line x1="135" y1="58" x2="310" y2="58" stroke="#C9A24B" stroke-width="0.6" stroke-dasharray="3,20"/>
    <line x1="148" y1="78" x2="308" y2="78" stroke="#C9A24B" stroke-width="0.5" stroke-dasharray="7,14"/>
    <line x1="142" y1="96" x2="312" y2="96" stroke="#C9A24B" stroke-width="0.6" stroke-dasharray="4,19"/>
    <line x1="155" y1="114" x2="300" y2="114" stroke="#C9A24B" stroke-width="0.5" stroke-dasharray="5,17"/>
  </g>
  <!-- 中景：云纹飘带 -->
  <g filter="url(#pm)" opacity="0.2">
    <path d="M220 90 Q240 78 260 88 Q275 95 285 85 Q298 72 312 80" stroke="#C9A24B" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M200 110 Q222 98 240 108 Q255 115 270 108 Q283 100 300 108" stroke="#C9A24B" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- 前景：唐代大屋顶 + 宋代瘦塔 -->
  <g filter="url(#ps)" opacity="0.32">
    <!-- 唐殿（右侧大） -->
    <path d="M230 130 L235 125 L240 120 L245 125 L250 120 L255 125 L262 130" stroke="#C9A24B" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
    <path d="M230 130 L230 145 L262 145 L262 130" stroke="#C9A24B" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <line x1="235" y1="145" x2="235" y2="138" stroke="#C9A24B" stroke-width="1.2"/>
    <line x1="260" y1="145" x2="260" y2="138" stroke="#C9A24B" stroke-width="1.2"/>
    <!-- 飞檐翘角 -->
    <path d="M222 128 L230 135" stroke="#C9A24B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M270 128 L262 135" stroke="#C9A24B" stroke-width="1.6" stroke-linecap="round"/>
    <!-- 宋塔（左侧瘦） -->
    <rect x="178" y="114" width="14" height="2.5" rx="1" fill="#C9A24B" opacity="0.8"/>
    <rect x="180" y="108" width="10" height="2" rx="1" fill="#C9A24B" opacity="0.7"/>
    <rect x="182" y="102" width="6" height="2" rx="1" fill="#C9A24B" opacity="0.55"/>
    <rect x="181" y="116" width="10" height="24" rx="1" fill="none" stroke="#C9A24B" stroke-width="1.5"/>
    <line x1="181" y1="124" x2="191" y2="124" stroke="#C9A24B" stroke-width="0.8"/>
    <line x1="181" y1="130" x2="191" y2="130" stroke="#C9A24B" stroke-width="0.8"/>
    <!-- 塔尖 -->
    <line x1="185" y1="102" x2="185" y2="96" stroke="#C9A24B" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="185" cy="95" r="1.5" fill="#C9A24B"/>
  </g>
  <!-- 金点装饰：朝代时间感 -->
  <circle cx="290" cy="40" r="2" fill="#C9A24B" opacity="0.25"/>
  <circle cx="270" cy="55" r="1.5" fill="#C9A24B" opacity="0.2"/>
  <circle cx="305" cy="70" r="2.2" fill="#C9A24B" opacity="0.18"/>
</svg>