<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 156">
  <defs>
    <filter id="ps" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0.8" dy="0.8" stdDeviation="1.2" flood-color="#3E5C6B" flood-opacity="0.3"/>
    </filter>
    <filter id="pm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#3E5C6B" flood-opacity="0.2"/>
    </filter>
    <filter id="pb" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.5" flood-color="#3E5C6B" flood-opacity="0.12"/>
    </filter>
    <mask id="moonMask">
      <rect x="0" y="0" width="320" height="156" fill="white"/>
      <circle cx="290" cy="48" r="14" fill="black"/>
      <circle cx="296" cy="44" r="12" fill="white"/>
    </mask>
  </defs>
  <!-- 背景：竹叶影 -->
  <g filter="url(#pb)" opacity="0.1">
    <path d="M280 130 L290 115 L285 130" fill="#F4EBDA" opacity="0.8"/>
    <path d="M295 128 L302 110 L300 128" fill="#F4EBDA" opacity="0.6"/>
    <path d="M270 135 L282 120 L276 135" fill="#F4EBDA" opacity="0.5"/>
  </g>
  <!-- 中景：月光弧 -->
  <g filter="url(#pm)" opacity="0.2" mask="url(#moonMask)">
    <circle cx="290" cy="48" r="14" fill="#F4EBDA" opacity="0.5"/>
  </g>
  <circle cx="290" cy="48" r="14" fill="none" stroke="#F4EBDA" stroke-width="1.2" opacity="0.25"/>
  <!-- 前景：文人案头 -->
  <g filter="url(#ps)" opacity="0.3">
    <!-- 展开纸卷 -->
    <path d="M160 120 Q180 108 200 115 L195 130 Q180 128 165 132 Z" fill="none" stroke="#F4EBDA" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M200 115 Q220 120 240 112 L232 128 Q215 132 195 130 Z" fill="none" stroke="#F4EBDA" stroke-width="1.6" stroke-linejoin="round" opacity="0.7"/>
    <!-- 毛笔（竹杆+毫尖） -->
    <line x1="245" y1="90" x2="238" y2="130" stroke="#F4EBDA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="238" y1="130" x2="234" y2="142" stroke="#F4EBDA" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
    <!-- 砚台 -->
    <rect x="265" y="122" width="22" height="13" rx="3" fill="none" stroke="#F4EBDA" stroke-width="1.6"/>
    <ellipse cx="276" cy="128" rx="7" ry="3.5" fill="#F4EBDA" opacity="0.25"/>
    <!-- 墨迹 -->
    <circle cx="276" cy="128" r="2.5" fill="#F4EBDA" opacity="0.35"/>
  </g>
  <!-- 月光粒子 -->
  <circle cx="275" cy="30" r="1.2" fill="#F4EBDA" opacity="0.2"/>
  <circle cx="295" cy="20" r="1" fill="#F4EBDA" opacity="0.15"/>
  <circle cx="260" cy="38" r="0.8" fill="#F4EBDA" opacity="0.12"/>
</svg>