<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 156">
  <defs>
    <filter id="ps" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0.8" dy="0.8" stdDeviation="1.2" flood-color="#B5A68A" flood-opacity="0.3"/>
    </filter>
    <filter id="pm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="2" flood-color="#B5A68A" flood-opacity="0.2"/>
    </filter>
    <filter id="pb" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1.5" flood-color="#B5A68A" flood-opacity="0.12"/>
    </filter>
    <mask id="moonMask2">
      <rect x="0" y="0" width="320" height="156" fill="white"/>
      <circle cx="288" cy="42" r="12" fill="black"/>
      <circle cx="294" cy="38" r="10" fill="white"/>
    </mask>
  </defs>
  <!-- 背景层：远山 -->
  <g filter="url(#pb)" opacity="0.12">
    <path d="M140 120 L170 90 L200 100 L230 75 L260 95 L290 80 L310 105 L310 120 Z" fill="#B5A68A" opacity="0.6"/>
  </g>
  <!-- 中景层：中山 -->
  <g filter="url(#pm)" opacity="0.18">
    <path d="M160 130 L185 105 L210 115 L240 95 L270 108 L300 98 L310 125 L310 135 Z" fill="#B5A68A" opacity="0.7"/>
  </g>
  <!-- 中景：水面 -->
  <g opacity="0.12">
    <rect x="150" y="130" width="155" height="20" rx="2" fill="#B5A68A" opacity="0.15"/>
    <line x1="160" y1="136" x2="195" y2="136" stroke="#B5A68A" stroke-width="0.5" opacity="0.4"/>
    <line x1="220" y1="140" x2="265" y2="140" stroke="#B5A68A" stroke-width="0.4" opacity="0.3"/>
    <line x1="178" y1="144" x2="205" y2="144" stroke="#B5A68A" stroke-width="0.5" opacity="0.25"/>
  </g>
  <!-- 前景：月牙（mask 镂空） -->
  <g mask="url(#moonMask2)" opacity="0.28">
    <circle cx="288" cy="42" r="12" fill="#D9A6A0"/>
  </g>
  <circle cx="288" cy="42" r="12" fill="none" stroke="#D9A6A0" stroke-width="1.2" opacity="0.25"/>
  <!-- 前景：孤舟 -->
  <g filter="url(#ps)" opacity="0.3">
    <!-- 船篷 -->
    <path d="M240 128 Q250 118 260 128" stroke="#D9A6A0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="250" y1="118" x2="250" y2="130" stroke="#D9A6A0" stroke-width="1" opacity="0.6"/>
    <line x1="245" y1="128" x2="255" y2="128" stroke="#D9A6A0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- 桅杆 -->
    <line x1="250" y1="128" x2="250" y2="110" stroke="#D9A6A0" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- 前景：柳枝 -->
  <g filter="url(#ps)" opacity="0.22">
    <path d="M295 135 Q300 120 298 100 Q296 88 300 78" stroke="#D9A6A0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M300 110 Q306 105 308 112" stroke="#D9A6A0" stroke-width="0.8" fill="none" opacity="0.6"/>
    <path d="M299 100 Q305 96 306 104" stroke="#D9A6A0" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M298 90 Q304 86 305 94" stroke="#D9A6A0" stroke-width="0.7" fill="none" opacity="0.4"/>
  </g>
  <!-- 花鸟剪影 -->
  <g opacity="0.15">
    <path d="M175 102 L178 96 L181 102 L178 98 Z" fill="#D9A6A0" opacity="0.5"/>
    <path d="M165 95 Q170 88 175 93" stroke="#D9A6A0" stroke-width="0.8" fill="none" opacity="0.4"/>
    <circle cx="178" cy="95" r="1.5" fill="none" stroke="#D9A6A0" stroke-width="0.6" opacity="0.5"/>
  </g>
</svg>